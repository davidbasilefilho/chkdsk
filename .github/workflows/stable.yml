name: stable

# Merging the dev -> main pull request (a squash merge) publishes the stable
# release automatically: v<version> comes from Cargo.toml, which the pull request
# check forced above the previous stable tag. Release runs are never cancelled.
on:
  push:
    branches: [main]

concurrency:
  group: stable-release
  cancel-in-progress: false

permissions: {}

jobs:
  # Refuses a tag that already exists at another commit or a version that does
  # not rise above the latest stable tag; skips when this commit is already released.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py plan-stable

  validation:
    needs: plan
    if: ${{ needs.plan.outputs.skip == 'false' }}
    uses: ./.github/workflows/validation.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
    permissions:
      contents: read

  release:
    needs: [plan, validation]
    uses: ./.github/workflows/release.yml
    with:
      mode: stable
      sha: ${{ needs.plan.outputs.sha }}
      tag: ${{ needs.plan.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write
      actions: read

  # dev -> main is squash-merged, so main's release commit is not an ancestor of
  # dev. Recording it with a no-op merge keeps the next dev -> main diff to new work.
  backmerge:
    needs: [plan, release]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.release.result == 'success' || needs.plan.outputs.skip == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASED_SHA: ${{ needs.plan.outputs.sha }}
      RELEASED_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - name: Merge the release commit into dev without changing dev's content
        run: |
          git fetch --no-tags origin "$RELEASED_SHA"
          if git merge-base --is-ancestor "$RELEASED_SHA" HEAD; then
            echo "dev already contains $RELEASED_SHA"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge -s ours --no-edit -m "chore: merge main into dev after $RELEASED_TAG" "$RELEASED_SHA"
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if ! git -c "http.extraheader=$header" push origin HEAD:dev; then
            echo "::error::Could not push the back-merge to dev. Allow github-actions to push to dev (branch protection bypass), or merge main into dev locally with 'git merge -s ours' and a merge commit; a squash-merged pull request cannot record the ancestry."
            exit 1
          fi
