[package]
name = "chkdsk"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
# Rune has no crates.io release; pin the exact `dev` commit.
rune = { git = "https://github.com/anomalyco/rune", rev = "757bcb1d1da1b3f80484f36ef610b83ddbcc6003", default-features = false, features = ["accessibility"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Fixture disks for `--snap out.png --scene saudavel` and friends; no effect on the window.
scenes = []
