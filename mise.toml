[tools]
rust = { version = "stable", components = ["rustfmt", "clippy"], targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"] }
python = "3.12"
"github:llvm/llvm-project" = { version = "llvmorg-23.1.2", matching = "clang+llvm", matching_regex = "\\.tar\\.xz$" }
prek = "latest"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Lint every target and feature for x64 and ARM64"
run = "python scripts/release.py clippy"

[tasks.tests]
description = "Run the complete x64 Windows test suite"
run = "python scripts/release.py tests"

[tasks.clippy-host]
description = "Lint every target and feature for the host platform"
run = "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"

[tasks.clippy-xwin]
description = "Cross-lint the x64 and ARM64 Windows targets with cargo-xwin (runs on Linux)"
run = "python scripts/release.py xwin-clippy"

[tasks.tests-host]
description = "Run the workspace tests on the host platform (Windows-only code is stubbed out)"
run = "cargo test --locked --workspace --all-features"

[tasks.compile]
description = "Compile every Cargo target and feature for x64 and ARM64"
run = "python scripts/release.py compile"

[tasks.release-check]
description = "Self-check release tags, version rules, planning, pruning and Windows target mapping"
run = "python scripts/release.py self-check"

[tasks.linker-check]
description = "Verify the x64 and ARM64 MSVC environment and linkers"
run = "python scripts/release.py linker-check"

[tasks.ci-linux]
description = "Checks CI runs on Linux: formatting, host and xwin lint, host tests, release script self-check"
run = [
  { task = "fmt" },
  { task = "release-check" },
  { task = "clippy-host" },
  { task = "clippy-xwin" },
  { task = "tests-host" },
]

[tasks.validation]
description = "Run formatting, lint, tests, all-architecture compilation, and release checks on Windows"
run = [
  { task = "fmt" },
  { task = "release-check" },
  { task = "linker-check" },
  { task = "clippy" },
  { task = "tests" },
  { task = "compile" },
]

[tasks.setup-hook]
description = "Install the repository pre-commit hook"
run = "prek install"

[tasks.release]
description = "Build the optimized x64, x64-baseline and ARM64 executables for the current commit"
run = [
  { task = "release-x64" },
  { task = "release-x64-baseline" },
  { task = "release-arm64" },
]

[tasks.release-x64]
description = "Build the x64 (x86-64-v3, AVX2) executable into dist/release"
run = "python scripts/release.py build --mode dev --variant x64"

[tasks.release-x64-baseline]
description = "Build the x64-baseline (x86-64-v2) executable into dist/release"
run = "python scripts/release.py build --mode dev --variant x64-baseline"

[tasks.release-arm64]
description = "Build the ARM64 executable into dist/release"
run = "python scripts/release.py build --mode dev --variant arm64"
