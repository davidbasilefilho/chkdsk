[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
chkdsk-core = { path = "crates/chkdsk-core" }
chkdsk-windows = { path = "crates/chkdsk-windows" }
# Rune has no crates.io release; pin the exact `dev` commit.
rune = { git = "https://github.com/anomalyco/rune", rev = "757bcb1d1da1b3f80484f36ef610b83ddbcc6003", default-features = false, features = ["accessibility"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = "=0.61.2"
