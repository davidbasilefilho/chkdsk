name: release

# Reusable build, sign and publish pipeline shared by dev.yml (pre-releases) and
# stable.yml (stable releases). Callers decide whether a commit needs a release;
# nothing here builds a commit twice because every artifact feeds the same publish job.
#
# Signing is an explicit decision made once, by the config job: `signed` (SignPath
# is configured and this is a push to dev or main), `unconfigured` (SignPath is not
# set up) or `disabled` (pull requests run unreviewed code and never sign). Publishing
# needs that decision; when it is `signed`, a failed or skipped signing stops the release.
on:
  workflow_call:
    inputs:
      mode:
        description: dev or stable
        required: true
        type: string
      sha:
        description: Commit to release
        required: true
        type: string
      tag:
        description: Tag computed by the caller's plan job (re-derived and compared by release.py)
        required: true
        type: string
    secrets:
      SIGNPATH_API_TOKEN:
        required: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  MISE_DISABLE_TOOLS: github:llvm/llvm-project,prek

jobs:
  # Job conditions cannot read secrets, so this job turns the signing decision
  # into an output. Only a push to dev or main may sign; anything else (pull
  # requests above all) is `disabled` without looking at the secret. A half
  # configured SignPath (only the organization ID or only the token) fails here
  # instead of silently publishing unsigned.
  config:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      signing: ${{ steps.signing.outputs.signing }}
    steps:
      - id: signing
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ "$EVENT" != push ] || { [ "$REF" != refs/heads/dev ] && [ "$REF" != refs/heads/main ]; }; then
            echo "signing=disabled" >> "$GITHUB_OUTPUT"
            echo "Only pushes to dev and main are signed; the executables are published unsigned."
          elif [ -n "$SIGNPATH_ORGANIZATION_ID" ] && [ -n "$SIGNPATH_API_TOKEN" ]; then
            echo "signing=signed" >> "$GITHUB_OUTPUT"
          elif [ -z "$SIGNPATH_ORGANIZATION_ID" ] && [ -z "$SIGNPATH_API_TOKEN" ]; then
            echo "signing=unconfigured" >> "$GITHUB_OUTPUT"
            echo "SignPath is not configured; the executables are published unsigned."
          else
            echo "::error::SignPath is half configured: set both the SIGNPATH_ORGANIZATION_ID variable and the SIGNPATH_API_TOKEN secret, or neither."
            exit 1
          fi

  # One native MSVC build per asset; each variant has its own target directory and cache.
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        variant: [x64, x64-baseline, arm64]
    defaults:
      run:
        shell: bash
    env:
      MISE_RUSTUP_HOME: 'C:\Users\runneradmin\AppData\Local\mise\rustup'
      MISE_CARGO_HOME: 'C:\Users\runneradmin\AppData\Local\mise\cargo'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          cache: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target/${{ matrix.variant }}"
          key: release-${{ matrix.variant }}
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
      - name: Build, verify and smoke-test the executable
        env:
          MODE: ${{ inputs.mode }}
          VARIANT: ${{ matrix.variant }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: mise exec -- python scripts/release.py build --mode "$MODE" --variant "$VARIANT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exe-${{ matrix.variant }}
          path: dist/release/*.exe
          if-no-files-found: error
          retention-days: 7

  # Authenticode signing through SignPath, before checksums are written.
  sign:
    needs: [config, build]
    if: ${{ needs.config.outputs.signing == 'signed' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: exe-*
          merge-multiple: true
          path: dist/unsigned
      - id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-exes
          path: dist/unsigned/*.exe
          if-no-files-found: error
          retention-days: 1
      - uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: "true"
          output-artifact-directory: dist/signed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-exes
          path: dist/signed/*.exe
          if-no-files-found: error
          retention-days: 7

  # Publishes only with a signing decision: signed releases need the sign job to
  # have succeeded, the others need it to have been skipped on purpose.
  publish:
    needs: [config, build, sign]
    if: ${{ !cancelled() && needs.config.result == 'success' && needs.build.result == 'success' && (needs.config.outputs.signing == 'signed' && needs.sign.result == 'success' || needs.config.outputs.signing != 'signed' && needs.sign.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      MODE: ${{ inputs.mode }}
      RELEASE_SHA: ${{ inputs.sha }}
      RELEASE_TAG: ${{ inputs.tag }}
      SIGNING: ${{ needs.config.outputs.signing }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Download the signed executables
        if: ${{ needs.config.outputs.signing == 'signed' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-exes
          path: dist/release
      - name: Download the executables
        if: ${{ needs.config.outputs.signing != 'signed' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: exe-*
          merge-multiple: true
          path: dist/release
      - name: Write checksums
        run: python3 scripts/release.py checksums --mode "$MODE" --assets-dir dist/release
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish --mode "$MODE" --assets-dir dist/release --signing "$SIGNING"
      # Never deletes the release published above, a draft or a stable release.
      - name: Prune old development pre-releases
        if: ${{ inputs.mode == 'dev' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py prune --keep 10 --exclude-tag "$RELEASE_TAG"
