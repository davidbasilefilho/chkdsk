name: Inspect PR 12 artifacts
on: push
permissions:
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 46008531046
          github-token: ${{ github.token }}
          path: artifacts
      - run: |
          cd artifacts/chkdsk-0.1.0-98d5f0e
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt
          file *.exe ../fixture-98d5f0e/fixture.png
          node - . <<'JS'
          const {readFileSync, readdirSync} = require('node:fs');
          const {join} = require('node:path');
          const {createHash} = require('node:crypto');
          const assert = require('node:assert/strict');
          const dir = process.argv[2];
          const expected = new Map([['chkdsk-0.1.0-windows-x64-baseline.exe',0x8664],['chkdsk-0.1.0-windows-arm64.exe',0xAA64]]);
          assert.deepEqual(readdirSync(dir).sort(), [...expected.keys(),'SHA256SUMS.txt'].sort());
          const manifest = readFileSync(join(dir,'SHA256SUMS.txt'),'utf8').trimEnd().split(/\r?\n/);
          assert.equal(manifest.length,2);
          for (const [name,machine] of expected) {
            const data=readFileSync(join(dir,name));
            assert.equal(data.readUInt16LE(0),0x5a4d);
            const pe=data.readUInt32LE(0x3c);
            assert.equal(data.readUInt32LE(pe),0x4550);
            assert.equal(data.readUInt16LE(pe+4),machine);
            assert.equal(data.readUInt16LE(pe+24),0x20b);
            const digest=createHash('sha256').update(data).digest('hex');
            assert(manifest.includes(digest+'  '+name));
            console.log(name,data.length,'bytes','PE32+','0x'+machine.toString(16),digest);
          }
          JS
