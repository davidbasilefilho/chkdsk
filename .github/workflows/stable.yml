name: stable release

on:
  push:
    tags:
      - "v*"
      - "!*-dev-*"

jobs:
  validation:
    uses: ./.github/workflows/validation.yml
    permissions:
      contents: read

  build:
    needs: validation
    if: ${{ needs.validation.result == 'success' }}
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      MISE_RUSTUP_HOME: 'C:\Users\runneradmin\AppData\Local\mise\rustup'
      MISE_CARGO_HOME: 'C:\Users\runneradmin\AppData\Local\mise\cargo'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          install: true
      - name: Validate tag and build all stable executables
        run: mise run package-stable
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: [validation, build]
    if: ${{ needs.validation.result == 'success' && needs.build.result == 'success' }}
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      MISE_RUSTUP_HOME: 'C:\Users\runneradmin\AppData\Local\mise\rustup'
      MISE_CARGO_HOME: 'C:\Users\runneradmin\AppData\Local\mise\cargo'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          install: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist/release
      - name: Verify assets and publish the completed draft
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: mise run publish-stable
