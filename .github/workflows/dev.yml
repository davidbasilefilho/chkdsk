name: dev

# Pushes to dev and pull requests into dev or main (every other branch, including
# holyagent/** and checkpoint branches, triggers nothing). A pull request's push
# event is not listed, so a commit never runs twice; the one overlap, a push to dev
# while a dev -> main pull request is open, is skipped by the plan job.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

# Newer pull request commits supersede older runs. Pushes to dev queue instead,
# so a run that is publishing is never cancelled halfway.
concurrency:
  group: dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Pull requests into main must come from dev and raise the ZeroVer version
  # above the latest stable tag. Make this job a required check on main.
  version:
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the source branch and the version bump
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: python3 scripts/release.py check-version

  # Decides what this event validates and releases, from the commit alone:
  # documentation-only changes, an open pull request covering a push to dev,
  # forks, and a pre-release that already exists all skip work.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      validate: ${{ steps.plan.outputs.validate }}
      release: ${{ steps.plan.outputs.release }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          BRANCH: ${{ github.ref_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py plan-dev

  validation:
    needs: plan
    if: ${{ needs.plan.outputs.validate == 'true' }}
    uses: ./.github/workflows/validation.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
    permissions:
      contents: read

  prerelease:
    needs: [plan, validation]
    if: ${{ needs.plan.outputs.release == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      mode: dev
      sha: ${{ needs.plan.outputs.sha }}
      tag: ${{ needs.plan.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write
      actions: read
