name: validation

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validation:
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      MISE_RUSTUP_HOME: 'C:\Users\runneradmin\AppData\Local\mise\rustup'
      MISE_CARGO_HOME: 'C:\Users\runneradmin\AppData\Local\mise\cargo'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install: true
      - run: mise run validation

  distribution:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MISE_RUSTUP_HOME: 'C:\Users\runneradmin\AppData\Local\mise\rustup'
      MISE_CARGO_HOME: 'C:\Users\runneradmin\AppData\Local\mise\cargo'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - name: Build and verify the development distribution
        run: mise exec -- bun scripts/release.ts package --mode dev --sha $env:SOURCE_SHA --output dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dev-${{ env.SOURCE_SHA }}
          path: dist/release/
          if-no-files-found: error

  smoke:
    needs: distribution
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            profiles: x64,x64-baseline
          - runner: windows-11-arm
            profiles: arm64
    runs-on: ${{ matrix.runner }}
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-dev-${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run the packaged graphical interface
        env:
          PROFILES: ${{ matrix.profiles }}
        run: |
          foreach ($line in Get-Content SHA256SUMS.txt) {
            $hash, $name = $line -split '  ', 2
            if ((Get-FileHash -Algorithm SHA256 $name).Hash -ne $hash) { throw "Checksum mismatch for $name" }
          }
          foreach ($profile in $env:PROFILES.Split(',')) {
            $gui = (Get-Item "*-windows-$profile.exe").FullName
            $stamp = & $gui --build-profile | Out-String
            if ($LASTEXITCODE -or $stamp.Trim() -ne "disksonar-cpu:$profile;") { throw "Profile mismatch: $gui" }
            foreach ($scene in @("saudavel", "macrovip", "settings")) {
              foreach ($size in @("1100x720", "440x640")) {
                $image = "fixture-$scene-$profile-$size.png"
                & $gui --scene $scene --snap $image --size $size --scale 1 --theme dark | Out-Host
                if ($LASTEXITCODE -or !(Test-Path $image)) { throw "Graphical fixture failed: $image" }
              }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-${{ matrix.runner }}
          path: fixture-*.png
          if-no-files-found: error
