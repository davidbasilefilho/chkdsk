repos:
  - repo: local
    hooks:
      - id: rustfmt
        name: Rust formatting
        entry: mise run fmt
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: clippy
        name: Clippy
        entry: mise run clippy
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
