[package]
name = "disksonar-windows"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
disksonar-core = { path = "../disksonar-core" }

[target.'cfg(windows)'.dependencies]
serde_json = "1"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemInformation",
] }
