name: validation

on:
  pull_request:
  workflow_call:

jobs:
  validation:
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      MISE_RUSTUP_HOME: 'C:\Users\runneradmin\AppData\Local\mise\rustup'
      MISE_CARGO_HOME: 'C:\Users\runneradmin\AppData\Local\mise\cargo'
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          install: true
      - run: mise run validation
