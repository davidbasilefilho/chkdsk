name: preview release

on:
  workflow_run:
    workflows: [validation]
    types: [completed]

permissions: {}

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'dev'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
      - name: Publish the verified preview
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN: ${{ github.event.workflow_run.id }}
          VALIDATION_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: bun scripts/preview-release.ts
