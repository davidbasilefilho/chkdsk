name: Verify channel installation on Windows
on: push
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      SOURCE_SHA: 5c8aaf79863fd33b1260bb4bfef7f06e1c125742
      MISE_DISABLE_TOOLS: rust,bun,hk,github:llvm/llvm-project
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5
      - name: Wait for immutable input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 46037830493 --exit-status --interval 45
      - name: Resolve and install two live channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($variant in @("pr-13,x64-baseline","pr,x64")) {
            $channel,$profile = $variant.Split(",")
            $lines = mise run channel-install $channel $profile
            $lines | Out-Host
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $spec = ($lines | Select-String -Pattern  "^mise x '(.+)' -- disksonar\.exe$").Matches.Groups[1].Value
            if (!$spec.Contains($env:SOURCE_SHA)) { throw "Unexpected mise pin" }
            "$($profile.Replace('-','_'))=$spec" >> $env:GITHUB_ENV
          }
      - name: Run installed executable through mise
        run: |
          foreach ($spec in @($env:x64_baseline, $env:x64)) {
            $key = Split-Path -Leaf ($spec.Split("@path:")[-1])
            $version = mise x $spec -- disksonar.exe --version | Out-String
            if ($LASTEXITCODE -or $version.Trim() -ne 'disksonar 0.1.0') { throw "Installed GUI failed" }
            $image = "installed-" + $key + ".png"
            mise x $spec -- disksonar.exe --scene settings --snap $image --size 440x640 | Out-Host
            if ($LASTEXITCODE -or !(Test-Path $image)) { throw "Installed fixture failed" }
          }
